name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # --no-audit --no-fund keep the output readable; --legacy-peer-deps is
      # required because baileys ships peer ranges that npm 10 will not resolve
      # on its own.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm test
